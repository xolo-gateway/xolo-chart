{{- include "xolo.validate" . }}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "xolo.fullname" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := (get $existing "data") | default dict }}
{{- $secretKey := .Values.secrets.secretKey | default (get $data "XOLO_SECRET_KEY" | default "" | b64dec) }}
{{- if not $secretKey }}
{{- /* 32 random bytes, hex encoded: randAlphaNum would not give 256 bits. */}}
{{- $secretKey = sha256sum (randAscii 64) }}
{{- end }}
{{- $sessionKeys := .Values.secrets.sessionKeys | default (get $data "XOLO_HTTP_SESSION_KEYS" | default "" | b64dec) }}
{{- if not $sessionKeys }}
{{- $sessionKeys = randAlphaNum 64 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "xolo.labels" . | nindent 4 }}
  annotations:
    # Deleting this Secret with the release would make every stored provider
    # API key unreadable.
    helm.sh/resource-policy: keep
type: Opaque
data:
  XOLO_SECRET_KEY: {{ $secretKey | b64enc | quote }}
  XOLO_HTTP_SESSION_KEYS: {{ $sessionKeys | b64enc | quote }}
{{- end }}
{{- if and (not .Values.database.existingSecret) .Values.database.dsn }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "xolo.databaseSecretName" . }}
  labels:
    {{- include "xolo.labels" . | nindent 4 }}
type: Opaque
data:
  dsn: {{ .Values.database.dsn | b64enc | quote }}
{{- end }}
