{{- if .Values.metrics.serviceMonitor.enabled }}
{{- if not .Values.metrics.serviceMonitor.tokenSecret.name }}
{{- fail "metrics.serviceMonitor.tokenSecret.name is required: /metrics only answers a platform admin's API token" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "xolo.fullname" . }}
  labels:
    {{- include "xolo.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "xolo.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics/
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.metrics.serviceMonitor.tokenSecret.name }}
          key: {{ .Values.metrics.serviceMonitor.tokenSecret.key }}
{{- end }}
